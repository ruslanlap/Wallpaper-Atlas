name: Suggest a collection
description: Help others discover a great wallpaper source
body:
  - type: input
    id: url
    attributes:
      label: Collection URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What makes it special?
      description: Mention style, devices, image credits and known usage terms.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that this source is not already in the catalog.
          required: true
