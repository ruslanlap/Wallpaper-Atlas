name: Publish Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp index.html app.js catalog.js README.md CONTRIBUTING.md LICENSE _site/
          cp -r previews _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deploy
